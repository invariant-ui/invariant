<!-- icon slot -->
<span class="icon"><ng-content select="[slot=icon]" /></span>
<span class="label" role="presentation" aria-live="polite" [attr.aria-busy]="loading()">
  @if (loading() && a<b) {
    <acme-spinner />
  }
  {{ label() }}
  <ng-content />
</span>
<ng-content select="acme-badge"></ng-content>
