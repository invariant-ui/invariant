# Releases the CLI to npm. The plugins are versioned and released separately.
#
# Every push to main runs release-please, which keeps one release PR open: it bumps the version and writes the
# changelog from conventional commits. A job then regenerates what depends on that version (golden files and the
# pinned examples on the website) and pushes it to the release PR. The plugins have their own version and are not
# part of this release (see docs/releasing.md).
# Merging the release PR creates the tag and GitHub release; the publish job then runs the full checks and
# publishes to npm. Needs the RELEASE_PLEASE_TOKEN secret. See docs/releasing.md.
name: Release
on:
  push:
    branches: [main]
  # Publish a release that already has its tag, for example after the publish job failed its checks:
  # Actions, Release, Run workflow, and give the tag (such as v0.2.0). It publishes the current main.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (must equal the version in apps/cli/package.json)
        required: true
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # A personal access token, not the default GITHUB_TOKEN: it lets release-please open its pull request
          # without the org-level "create pull requests" setting, and it makes CI run on that pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please's own `pr` output is only set when it creates or edits the pull request in this very run, so
  # it is empty on most pushes. Ask GitHub for the open release pull request instead.
  find-release-pr:
    needs: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "release pull request branch: ${branch:-none}"

  # The version appears in files release-please does not know about. Regenerate them on the release PR, so
  # that merging it leaves main consistent and `pnpm verify` passes.
  prepare:
    needs: find-release-pr
    if: needs.find-release-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find-release-pr.outputs.branch }}
          # Pushes made with this token trigger CI on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pin the new version in the website's CI examples
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          sed -i -E "s#@invariant-ui/cli@[0-9]+\.[0-9]+\.[0-9]+[-0-9A-Za-z.]*#@invariant-ui/cli@${version}#g" site/index.html site/docs/index.html
      - name: Update golden files (only versions and hashes should change)
        run: UPDATE_GOLDEN=1 pnpm exec vitest run
      - name: Push what changed to the release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to regenerate"; exit 0; fi
          git commit -m "chore: regenerate version-dependent files for the release"
          git push

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: The tag must match the package version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: test "$TAG" = "v$(node -p "require('./apps/cli/package.json').version")"
      - run: pnpm build:npm
      # No token: npm trusted publishing signs in with this job's identity. It is configured on the package's
      # settings page on npmjs.com (organization invariant-ui, repository invariant, workflow release.yml), and
      # it needs the id-token permission above.
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: dist-npm
          path: dist-npm

  # The same package on GitHub's registry, so it shows in the repository's Packages section. GitHub requires the
  # package scope to equal the repository owner, which is why the repository lives in the invariant-ui org. It is
  # a separate job so it can be re-run alone: npm has already accepted this version by the time it starts.
  publish-github:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-npm
          path: dist-npm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
