# Publishes the @invariant-ui/cli package to npm when a version tag is pushed (for example v0.1.0).
# It does nothing until the repository has an NPM_TOKEN secret (an npm automation token) and a tag is pushed.
name: Publish to npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Tag must match the package version
        run: test "v$(node -p "require('./apps/cli/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm build:npm
      - run: npm publish --provenance --access public
        working-directory: dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
